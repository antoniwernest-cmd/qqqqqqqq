function recordDrop(i,w,method){const correct=w===order[i],repeat=!correct&&events.some(e=>!e.correct&&e.word===w&&e.picture===order[i]);events.push({number:events.length+1,time:new Date().toISOString(),round,word:w,picture:order[i],correct,repeat,method});updateTotals()}

function refresh(){document.querySelectorAll('[data-word]').forEach(b=>{b.classList.toggle('used',answers.includes(b.dataset.word));b.setAttribute('aria-pressed',String(b.dataset.word===selected))});document.querySelectorAll('[data-slot]').forEach(b=>{const i=+b.dataset.slot,w=answers[i],ok=w===order[i];b.textContent=w||'Drop word here';b.draggable=Boolean(w);b.setAttribute('aria-label',w?'Move '+w+' from picture '+(i+1):'Word for picture '+(i+1));b.className='blank'+(w?(ok?' good':' retry'):'');$('f'+i).textContent=w?(ok?'✓ Correct':'Try again.'):''})}

{new Set(events.map(e=>e.round)).size}</strong></div></div><p>A repeat error is another placement of the same wrong word on the same picture, including across rounds. This report includes all retained attempts from Try again and Remix.</p><h2>Errors by picture</h2><table><thead><tr><th>Picture</th><th>Attempts</th><th>Errors</th><th>Repeat errors</th></tr></thead><tbody>${pictureRows||'<tr><td colspan="4">No placements recorded.</td></tr>'}</tbody></table><h2>Current picture set</h2><p>${order.map(esc).join(', ')}</p><section class="history"><h2>Every placement · Student ID: ${esc(teacherId.trim()||'Not entered')}</h2><table><thead><tr><th>#</th><th>Round</th><th>Time</th><th>Word</th><th>Picture</th><th>Result</th><th>Repeat</th><th>Method</th></tr></thead><tbody>${history||'<tr><td colspan="8">No placements recorded.</td></tr>'}</tbody></table></section></body></html>`;document.body.appendChild(frame)}

$('history').onclick=()=>{const body=$('reportBody');body.replaceChildren();const table=document.createElement('table');const head=table.createTHead().insertRow();['#','Round','Time','Word','Picture','Result','Repeat error','Method'].forEach(t=>{const th=document.createElement('th');th.textContent=t;head.appendChild(th)});const tbody=table.createTBody();events.forEach(e=>{const row=tbody.insertRow();[e.number,e.round,new Date(e.time).toLocaleTimeString(),e.word,e.picture,e.correct?'Correct':'Error',e.repeat?'Yes':'',e.method].forEach(v=>{row.insertCell().textContent=v})});body.appendChild(table);if(!events.length){const msg=document.createElement('p');msg.textContent='No placements recorded yet.';body.appendChild(msg)}$('report').showModal()};$('closeReport').onclick=()=>$('report').close();
$('export').onclick=()=>{const rows=[['Attempt','Round','Time','Word','Picture','Correct','Repeat error','Method'],...events.map(e=>[e.number,e.round,e.time,e.word,e.picture,e.correct,e.repeat,e.method])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='grey-cat-matching-record.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('clear').onclick=()=>{if(!confirm('Clear all recorded attempts and start a fresh activity? Download the record first if you want to keep it.'))return;events=[];round=1;answers.fill('');selected='';$('status').textContent='';render();updateTotals();saveRecord()};$('print').onclick=()=>window.print();render();updateTotals();
